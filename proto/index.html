<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Replay prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#08070a;color:#fff;font:15px/1.5 Inter,system-ui,sans-serif;
 min-height:100vh;display:grid;place-items:center;padding:22px}
.stage{display:grid;grid-template-columns:auto minmax(320px,440px);gap:30px;
 align-items:center;justify-content:center;max-width:920px;width:100%}
@media (max-width:820px){.stage{grid-template-columns:1fr;gap:16px;justify-items:center}
 .ph{height:min(56vh,480px)}}

/* ---------- the room ---------- */
.ph{position:relative;aspect-ratio:9/19;height:min(84vh,720px);border-radius:34px;
 overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.6);flex:0 0 auto}
.rings{position:absolute;left:50%;top:16%;transform:translate(-50%,-50%);
 width:150%;aspect-ratio:1;border-radius:50%;background:var(--ring1)}
.rings::after{content:'';position:absolute;inset:14%;border-radius:50%;background:var(--ring2)}
.col{position:relative;height:100%;display:flex;flex-direction:column;padding:14px 12px 12px}
.hd{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.hd b{font-size:13px;font-weight:700;display:block;line-height:1.2}
.hd span{font-size:10.5px;opacity:.72;display:block}
.logo{height:54px;display:grid;place-items:center;margin:12px 0 26px;padding:0 26px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.spk{display:flex;justify-content:center;gap:12px;margin-bottom:10px;position:relative;z-index:2}
.spk .a{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;
 border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.3)}
.spk .a img{width:100%;height:100%;object-fit:cover}
.onair{display:flex;align-items:center;justify-content:center;gap:7px;margin:2px 0 8px}
.onair i{font-style:normal;font-size:9px;letter-spacing:1px;font-weight:700;
 background:rgba(0,0,0,.34);border-radius:999px;padding:3px 9px}
.chat{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;
 mask-image:linear-gradient(180deg,transparent,#000 14%)}
.m{display:flex;gap:7px;align-items:flex-start;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m .av{width:21px;height:21px;border-radius:50%;flex:0 0 auto;object-fit:cover;
 background:rgba(0,0,0,.3)}
.m p{margin:0;font-size:11.5px;line-height:1.32;word-break:break-word}
.m p b{display:block;font-size:10px;opacity:.72;font-weight:700}
/* the caption, as a lower third */
.cap{position:absolute;left:14px;right:14px;bottom:16px;z-index:5;text-align:center;
 background:rgba(8,6,9,.86);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);
 border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;line-height:1.35;
 opacity:0;transform:translateY(5px);transition:.25s}
.cap.on{opacity:1;transform:none}

/* ---------- the argument ---------- */
.side{display:flex;flex-direction:column;gap:14px}
.claim{font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.12}
.claim em{font-style:normal;color:#ffd76b}
.sub{font-size:13.5px;color:rgba(255,255,255,.62);margin-top:-6px;line-height:1.45}
.readout{display:flex;align-items:baseline;gap:11px}
.readout .big{font-size:60px;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;
 color:#ffd76b;text-shadow:0 0 36px rgba(255,200,80,.35)}
.readout .unit{font-size:12.5px;color:rgba(255,255,255,.66);font-weight:600;line-height:1.3}
.chartwrap{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);
 border-radius:14px;padding:13px 14px 10px}
.clab{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.9px;
 text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700;margin-bottom:9px}
.chart{position:relative;height:96px;display:flex;align-items:flex-end;gap:1.4px}
.chart b{flex:1;background:rgba(255,255,255,.17);border-radius:1.5px 1.5px 0 0;
 min-height:1.5px;transition:background .25s,box-shadow .25s}
.chart b.lit{background:linear-gradient(180deg,#ffe49a,#ffb224);
 box-shadow:0 0 9px rgba(255,180,40,.5)}
.chart b.quiet{background:rgba(255,255,255,.26)}
.head{position:absolute;top:-5px;bottom:-3px;width:2px;background:#fff;
 box-shadow:0 0 11px 2px rgba(255,255,255,.65);transition:left .3s linear}
.foot{display:flex;justify-content:space-between;font-size:10px;
 color:rgba(255,255,255,.44);margin-top:7px}
.phase{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700;
 color:rgba(255,255,255,.5)}
.go{margin-top:2px;display:flex;gap:10px;align-items:center}
.go button{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;
 padding:11px 22px;background:#fff;color:#12101a;cursor:pointer}
.go small{color:rgba(255,255,255,.45);font-size:12px}
/* the resolve */
.end{position:absolute;inset:0;z-index:9;background:rgba(8,7,10,.93);backdrop-filter:blur(10px);
 display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:26px;
 text-align:center;border-radius:34px}
.end.on{display:flex;animation:in .4s ease-out}
.end .n{font-size:58px;font-weight:800;color:#ffd76b;line-height:1}
.end .t{font-size:15px;font-weight:600;max-width:22ch;line-height:1.45}
.end .s{font-size:11.5px;color:rgba(255,255,255,.55);max-width:26ch;line-height:1.5}
</style></head><body>
<div class="stage">
  <div class="ph" id="ph">
    <div class="rings"></div>
    <div class="col">
      <div class="hd"><div><b id="host"></b><span id="tag"></span></div></div>
      <div class="logo"><img id="logo" alt=""></div>
      <div class="spk" id="spk"></div>
      <div class="onair"><i>ON AIR</i><i id="listens"></i></div>
      <div class="chat" id="chat"></div>
    </div>
    <div class="cap" id="cap"></div>
    <div class="end" id="end">
      <div class="n" id="endn"></div>
      <div class="t" id="endt"></div>
      <div class="s" id="ends"></div>
    </div>
  </div>

  <div class="side">
    <div class="phase" id="phase">Before she speaks</div>
    <div class="claim" id="claim">She reads a name.<br><em>They buy.</em></div>
    <div class="sub" id="sub">Olivia Rodrigo, 23 April. The chat is already busy &mdash; 22 messages a second. What changes when she picks up the mic is that it starts converting.</div>
    <div class="readout">
      <div class="big" id="big">0</div>
      <div class="unit" id="unit">albums sold<br>in this clip</div>
    </div>
    <div class="chartwrap">
      <div class="clab"><span>Albums per 10 seconds</span><span id="clabr">whole show</span></div>
      <div class="chart" id="chart"><div class="head" id="head" style="left:0"></div></div>
      <div class="foot"><span>3 min in</span><span>she unmutes</span><span>16 min in</span></div>
    </div>
    <div class="go"><button id="btn">Play</button><small id="hint">51 seconds</small></div>
  </div>
</div>
<script>
const D = fetch('proto-data.json').then(r=>r.json());
const AVB='https://stationhead-production1-images.s3.amazonaws.com/images/Account/primary/';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mix=(h,k)=>{const n=parseInt(h.slice(1),16);
  const r=Math.round(((n>>16)&255)*k), g=Math.round(((n>>8)&255)*k), b=Math.round((n&255)*k);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};

let d, chart=[], audio, raf=0, t0=0, phase=0;
const BEFORE=6, CLIP=45, END=2;

D.then(j=>{
  d=j;
  const ph=document.getElementById('ph');
  ph.style.setProperty('--bg', mix(d.channel.accent,.70));
  ph.style.setProperty('--ring1', mix(d.channel.accent,.97));
  ph.style.setProperty('--ring2', mix(d.channel.accent,.80));
  host.textContent=d.host; tag.textContent=d.channel.tag;
  logo.src=d.channel.logo; listens.textContent='\u{1F464} '+d.listens.toLocaleString();
  spk.innerHTML=d.speakers.map(s=>`<div class="a">${s[1]?`<img src="${AVB}${s[1]}">`:''}</div>`).join('');
  // chart bars across the whole arc
  const max=Math.max(...d.arc.map(a=>a[1]));
  chart=d.arc.map(([sec,n])=>{const b=document.createElement('b');
    b.style.height=Math.max(1.5,(n/max)*96)+'px'; b.dataset.sec=sec;
    document.getElementById('chart').appendChild(b); return b;});
  placeHead(d.beforeFrom);
  btn.onclick=start;
});

function placeHead(sec){
  const first=d.arc[0][0], last=d.arc[d.arc.length-1][0];
  head.style.left=((sec-first)/(last-first)*100)+'%';
}
function litUpTo(sec){
  for(const b of chart){
    const s=+b.dataset.sec;
    b.classList.toggle('lit', s<=sec && s>=640);
    b.classList.toggle('quiet', s<=sec && s<640);
  }
}
function say(txt){ cap.textContent=txt||''; cap.classList.toggle('on', !!txt); }
function bubble(h,av,txt){
  const m=document.createElement('div'); m.className='m';
  m.innerHTML=`<img class="av" src="${av?AVB+av:'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22/%3E'}">`+
              `<p><b>${esc(h)}</b>${esc(txt)}</p>`;
  chat.appendChild(m);
  while(chat.children.length>9) chat.firstChild.remove();
}

function start(){
  btn.disabled=true; btn.textContent='Playing';
  audio=new Audio(d.audio); audio.preload='auto';
  chat.innerHTML=''; say(''); end.classList.remove('on');
  phase=1; t0=performance.now();
  let bi=0, ci=0, lastSec=-1;
  const beforeMsgs=d.before, clipMsgs=d.msgs, users=d.users;

  const tick=()=>{
    const el=(performance.now()-t0)/1000;

    if(phase===1){                                   // the quiet before
      document.getElementById('phase').textContent='Before she speaks';
      while(bi<beforeMsgs.length && beforeMsgs[bi][0]<=el*1000){
        const m=beforeMsgs[bi++]; bubble(m[1],m[2],m[3]);
      }
      const sec=d.beforeFrom + (el/BEFORE)*6;
      placeHead(sec); litUpTo(sec);
      big.textContent='0'; unit.innerHTML='albums sold<br>in six seconds';
      if(el>=BEFORE){                                 // sweep forward to the clip
        phase=2; t0=performance.now();
        document.getElementById('phase').textContent='Eight minutes later';
        audio.currentTime=d.clipStart; audio.play().catch(()=>{});
        unit.innerHTML='albums sold<br>since she started';
      }
      raf=requestAnimationFrame(tick); return;
    }

    if(phase===2){
      const e=audio.currentTime - d.clipStart;
      if(e<0){ raf=requestAnimationFrame(tick); return; }
      while(ci<clipMsgs.length && clipMsgs[ci][0]<=e*1000){
        const m=clipMsgs[ci++], u=users[m[1]]||['listener',''];
        bubble(u[0],u[1],m[2]);
      }
      let b=0; for(const [t,n] of d.purchases.perSec) if(t<=e) b+=n;
      big.textContent=b;
      const sec=d.clipStart+e; placeHead(sec); litUpTo(sec);
      let j=-1; for(let k=0;k<d.transcript.length;k++) if(d.transcript[k][0]<=e) j=k;
      say(j>=0?d.transcript[j][1]:'');
      document.getElementById('phase').textContent='She is on the mic';
      if(e>=CLIP){ phase=3; audio.pause(); t0=performance.now(); finish(); return; }
      raf=requestAnimationFrame(tick); return;
    }
  };
  raf=requestAnimationFrame(tick);
}

function finish(){
  say(''); litUpTo(900);
  document.getElementById('phase').textContent='What it was worth';
  endn.textContent='15×';
  endt.textContent='the rate before she spoke';
  ends.textContent='28 albums in forty-five seconds, from a channel selling three a minute. It stops when she logs off.';
  end.classList.add('on');
  btn.disabled=false; btn.textContent='Play again';
}
</script></body></html>
