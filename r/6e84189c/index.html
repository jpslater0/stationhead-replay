<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<title>Stationhead replay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{font-family:Inter,system-ui,sans-serif;background:#0d0b0e;color:#fff;overflow:hidden}

/* ---------- feed ---------- */
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
#feed::-webkit-scrollbar{display:none}
.slide{height:100vh;scroll-snap-align:start;display:grid;place-items:center;position:relative}
.fit{transform-origin:center center}

/* ---------- phone ---------- */
.ph{width:460px;height:898px;border-radius:38px;overflow:hidden;position:relative;
 background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.6);color:var(--ink)}
.rings{position:absolute;left:50%;top:252px;transform:translate(-50%,-50%);
 width:460px;height:460px;border-radius:50%;
 background:radial-gradient(circle closest-side,
   var(--ring1) 0%, var(--ring1) 68%,
   var(--ring2) 69%, var(--ring2) 90%,
   transparent 91%)}
.col{position:relative;height:100%;display:flex;flex-direction:column}

.hd{display:flex;align-items:center;gap:10px;padding:16px 14px 0}
.cbtn{width:36px;height:36px;border-radius:50%;background:var(--o10);display:grid;
 place-items:center;flex:0 0 auto;font-size:15px}
.cbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.hdT{flex:1;min-width:0}
.hdT b{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px}
.hdT span{display:block;font-size:13px;opacity:.62;margin-top:1px}
.pill{height:31px;border-radius:16px;background:var(--o10);display:flex;align-items:center;
 gap:5px;padding:0 13px;font-size:14px;font-weight:600}

.logo{height:96px;margin-top:34px;display:grid;place-items:center;padding:0 46px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.notechat{justify-content:center;gap:12px;padding:0 22px 20px;text-align:center}
.notechat p{font-size:15px;line-height:1.45;opacity:.9}
.notechat p.q{font-size:13px;opacity:.6;margin-top:2px}
.wordmark{font-size:38px;font-weight:800;letter-spacing:-1px;text-align:center;line-height:1.05}
/* voice note: no show behind it, so the card is the whole screen */
.note{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:18px;padding:40px 30px;text-align:center}
.note .lg{max-width:62%;max-height:130px;object-fit:contain}
.note .wm{font-size:40px;font-weight:800;letter-spacing:-1.2px}
.note .who{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;opacity:.7}
.note .bar{width:100%;max-width:330px;height:62px;border-radius:31px;background:var(--o65);
 display:flex;align-items:center;gap:10px;padding:0 10px;color:#241419;margin-top:4px}
.note .bar .av{width:44px;height:44px;border-radius:50%;background:rgba(36,20,25,.15);flex:0 0 auto}
.note .nt{font-size:14px;opacity:.85}
.hostwrap{display:grid;place-items:center;margin-top:46px}
.hostav{position:relative;width:72px;height:72px}
.av{border-radius:50%;background:#2d142c;display:block;overflow:hidden;object-fit:cover}
.mic{position:absolute;right:-3px;bottom:-1px;width:33px;height:33px;border-radius:50%;
 background:#fff;display:grid;place-items:center}
.mic svg{width:17px;height:17px}
.hostname{margin-top:8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
.hb{width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;
 place-items:center;font-size:8px}

.now{margin:36px 16px 0;height:62px;border-radius:14px;background:var(--o10);
 display:flex;align-items:center;gap:11px;padding:0 11px;position:relative;overflow:hidden}
.now .art{width:44px;height:44px;border-radius:5px;flex:0 0 auto;background:var(--o20)}
.now .meta{flex:1;min-width:0}
.now .meta b{display:block;font-size:15px;font-weight:700;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.now .meta span{display:flex;align-items:center;gap:5px;font-size:13px;opacity:.72;margin-top:1px}
.eq{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.eq i{width:2px;background:currentColor;border-radius:1px;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(1){height:40%}.eq i:nth-child(2){height:90%;animation-delay:.15s}
.eq i:nth-child(3){height:60%;animation-delay:.3s}.eq i:nth-child(4){height:100%;animation-delay:.45s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.heart{height:38px;border-radius:19px;background:var(--o10);display:grid;place-items:center;
 padding:0 14px;font-size:15px;flex:0 0 auto}
.now.voice{background:var(--o65);border-radius:31px;padding:0 9px;color:#241419}
.now.voice .art{border-radius:50%;background:rgba(36,20,25,.15)}
.wave{flex:1;display:flex;align-items:center;gap:2.5px;height:26px;min-width:0;overflow:hidden}
.wave i{flex:0 0 2px;background:rgba(36,20,25,.26);border-radius:1px}
.wave i.on{background:#241419}
.vtime{font-size:14px;font-weight:700;padding-right:6px;flex:0 0 auto;font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;gap:9px;padding:16px 18px 0}
.rule{flex:1;height:1.5px;background:var(--o20);border-radius:1px}
.tag{height:26px;border-radius:13px;background:var(--o20);display:flex;align-items:center;
 gap:5px;padding:0 13px;font-size:12px;font-weight:700;letter-spacing:.3px}
.tag.n{background:var(--o10);font-weight:600}
.tag svg{width:12px;height:12px;fill:var(--ink)}

.shop{margin:10px 12px 0;border-radius:10px;background:#fbf4f7;color:#191016;
 display:flex;align-items:center;gap:10px;padding:8px 9px;position:relative;z-index:3;
 box-shadow:0 5px 14px rgba(0,0,0,.16)}
.shop .th{width:34px;height:34px;border-radius:4px;flex:0 0 auto;background:#d8c6cd}
.shop .st{flex:1;min-width:0}
.shop .st b{display:block;font-size:13px;font-weight:700;line-height:1.2}
.shop .st b i{font-style:normal;color:#1d9bf0;font-size:12px}
.shop .st span{display:block;font-size:12px;color:#6c5560;margin-top:2px}
.shopbtn{height:29px;border-radius:15px;background:#cacaca;color:#1a1a1a;font-size:13px;
 font-weight:800;letter-spacing:.4px;display:grid;place-items:center;padding:0 16px;flex:0 0 auto}

.chatwrap{flex:1;min-height:0;position:relative;margin-top:-14px;padding-top:14px}
.chat{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
 gap:11px;padding:0 12px 6px;overflow:hidden}
.m{display:flex;gap:10px;align-items:flex-start}
.mav{width:40px;height:40px;flex:0 0 auto;position:relative}
.mav .av,.mav svg{width:40px;height:40px;border-radius:50%}
.mav .ov{position:absolute;left:0;top:0}
/* station syndicated to this channel */
.mav.sy .av,.mav.sy svg{border:2px solid #ffe06b}
.mav.sy .star{position:absolute;left:-1px;bottom:-1px;width:15px;height:15px;border-radius:50%;
 background:#ffe06b;display:grid;place-items:center;font-size:9px;color:#1a1208;z-index:2}
.mb{flex:1;min-width:0}
.mh{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mh b{font-size:15px;font-weight:700;letter-spacing:-.1px}
.mh em{font-style:normal;font-size:13px;opacity:.55}
.mt{font-size:15px;line-height:1.3;margin-top:1px;word-break:break-word}
.mt u{text-decoration:none;font-weight:700}

.ask{margin:0 12px 8px;height:60px;border-radius:13px;background:var(--o10);
 display:flex;align-items:center;position:relative;z-index:3}
.ask .mk{width:38px;height:38px;border-radius:50%;background:#6d4bf5;margin:0 11px;
 display:grid;place-items:center;flex:0 0 auto}
.ask .mk svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
.ask p{flex:1;font-size:14px;line-height:1.25}
.ask .go{border-left:1px solid var(--o20);padding:0 18px;height:100%;display:grid;
 place-items:center;font-size:14px;font-weight:700;flex:0 0 auto}

.cmp{display:flex;align-items:center;gap:9px;padding:0 12px 14px;position:relative;z-index:3}
.cb{width:38px;height:38px;border-radius:50%;background:var(--o10);display:grid;
 place-items:center;flex:0 0 auto;position:relative;font-size:16px}
.cb .n{position:absolute;top:-3px;left:-3px;min-width:17px;height:17px;border-radius:9px;
 background:var(--ink);color:var(--bg);font-size:10px;font-weight:800;display:grid;
 place-items:center;padding:0 4px}
.inp{flex:1;height:38px;border-radius:19px;background:var(--o10);display:flex;align-items:center;
 padding:0 6px 0 15px;font-size:15px;opacity:.85}
.inp .gif{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--o20);
 display:grid;place-items:center;font-size:9px;font-weight:800}

.hearts{position:absolute;right:16px;bottom:78px;width:70px;height:280px;
 pointer-events:none;z-index:2;overflow:hidden}
.hearts b{position:absolute;bottom:0;font-size:16px;opacity:.9;animation:fly 2.9s linear forwards}
@keyframes fly{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:1}
 100%{transform:translateY(-270px) scale(1.1);opacity:0}}

.gate{position:absolute;inset:0;z-index:9;cursor:pointer;color:#fff;overflow:hidden;
 background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;padding:34px 28px 38px}
.gate::before{content:'';position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);
 width:620px;height:620px;border-radius:50%;background:var(--ring1);opacity:.5}
.gate::after{content:'';position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(0,0,0,.08) 0%,rgba(0,0,0,.42) 52%,rgba(0,0,0,.78) 100%)}
.gate>*{position:relative;z-index:2}
.gate .nm{font-size:54px;line-height:.95;font-weight:800;letter-spacing:-2px;color:#fff;
 text-shadow:0 2px 24px rgba(0,0,0,.45);word-break:break-word}
.gate .ttl{font-size:16px;font-weight:600;margin-top:12px;color:#fff;opacity:.95}
.gate .ctx{font-size:15px;line-height:1.45;margin-top:10px;color:rgba(255,255,255,.88);max-width:34ch}
.gate .fx{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.gate .fx b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.gate .fx span{font-size:11px;letter-spacing:.7px;text-transform:uppercase;opacity:.7}
.gate .go{display:flex;align-items:center;gap:12px;margin-top:24px}
.gate .pb{width:60px;height:60px;border-radius:50%;background:#fff;color:#191016;display:grid;
 place-items:center;font-size:23px;padding-left:4px;flex:0 0 auto}
.gate .go em{font-style:normal;font-size:14px;opacity:.85}
.gate .dwell{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);
 transform-origin:left;transform:scaleX(0);z-index:3}
.gate .dwell.run{transform:scaleX(1);transition:transform linear}

/* ---------- rail ---------- */
.rail{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:20;
 display:flex;flex-direction:column;gap:9px}
.rail i{width:7px;height:7px;border-radius:50%;background:#4a424a;cursor:pointer;display:block}
.rail i.on{background:#fff;transform:scale(1.35)}
.meter{position:fixed;left:0;right:0;bottom:0;height:3px;background:#221d23;z-index:20}
.meter i{display:block;height:100%;width:0;background:#fff}
.hud{position:fixed;left:16px;bottom:14px;z-index:20;font-size:13px;color:#9b919a;
 display:flex;gap:14px;align-items:baseline;background:rgba(13,11,14,.82);
 padding:7px 13px;border-radius:9px;backdrop-filter:blur(6px)}
.hud b{color:#fff;font-variant-numeric:tabular-nums;font-size:15px}
.hud .t{color:#fff;font-weight:600}

</style></head><body>

<div id="root"></div>

<script>
const DEFAULT_ID='3336752:401000:180000';
const AVB='https://stationhead-production1-images.s3.amazonaws.com/images/Account/primary/';

/* ---- theme: measured off the app. background is the channel accent x 0.70 ---- */
function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lum(hex){
  const n=parseInt(hex.slice(1),16);
  return (0.2126*((n>>16)&255)+0.7152*((n>>8)&255)+0.0722*(n&255))/255;
}
function theme(accent){
  const bg=shade(accent,.70), light=lum(bg)>.62;
  const ink=light?'#241a1f':'#ffffff', base=light?'0,0,0':'255,255,255';
  return {bg,ink,ring2:shade(accent,.80),ring1:shade(accent,.97),
    o10:`rgba(${base},.14)`,o20:`rgba(${base},.31)`,o65:'rgba(255,255,255,.72)'};
}

const DEFAV=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#2d142c"/>
<path d="M11 21v-2a9 9 0 0 1 18 0v2" stroke="#c46bd8" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<rect x="8.5" y="20" width="5" height="8" rx="2.5" fill="#e0559f"/>
<rect x="26.5" y="20" width="5" height="8" rx="2.5" fill="#e0559f"/>
<circle cx="20" cy="30" r="4.4" fill="#c46bd8"/></svg>`;

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ment=s=>esc(s).replace(/(^|\s)(@[A-Za-z0-9_.]+)/g,'$1<u>$2</u>');
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const num=n=>n.toLocaleString('en-US');

/* ---- which moments? ?s=show:start:dur, repeatable ---- */
function wanted(){
  const q=new URLSearchParams(location.search);
  let s=q.getAll('s').flatMap(v=>v.split(','));
  return s.map(v=>v.trim()).filter(v=>/^\d+:\d+:\d+$/.test(v)||/^note:\d+$/.test(v));
}
const DWELL=2900;   // how long an intro card holds before the clip starts

/* ---------- one slide ---------- */
class Slide{
  constructor(id,el){this.id=id;this.el=el;this.loaded=false;this.shown=-1;this.mic=null;this.lastHeart=0;}

  async load(){
    if(this.loaded)return; this.loaded=true;
    const p=this.id.split(':');
    const file = p[0]==='note' ? `moments/note_${p[1]}.json`
                               : `moments/${p[0]}_${p[1]}_${p[2]}.json`;
    const r=await fetch(file);
    if(!r.ok){this.el.innerHTML=`<div style="color:#8c8189;font-size:14px;text-align:center">
      No baked moment for <b style="color:#fff">${esc(this.id)}</b><br>
      <span style="font-size:13px">Moments have to be built from the warehouse first.</span></div>`;return;}
    this.d=await r.json();
    this.render();
  }

  render(){
    const d=this.d, t=theme(d.channel.accent);
    if(d.kind==='note') return this.renderNote(t);
    const vars=Object.entries(t).map(([k,v])=>`--${k}:${v}`).join(';');
    this.el.innerHTML=`<div class="fit"><div class="ph" style="${vars}">
      <div class="rings"></div>
      <div class="col">
        <div class="hd">
          <div class="cbtn"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="hdT"><b>${esc(d.host)}</b><span>${esc(d.channel.tag)}</span></div>
          <div class="pill"># Threads</div>
          <div class="cbtn">&#128266;</div>
        </div>
        <div class="logo">${d.channel.logo
            ?`<img src="${d.channel.logo}" alt="${esc(d.channel.name)}">`
            :`<span class="wordmark">${esc(d.channel.name)}</span>`}</div>
        <div class="hostwrap">
          <div class="hostav">
            <svg class="av" viewBox="0 0 40 40" width="72" height="72">${DEFAV}</svg>
            <div class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="#191016" stroke-width="2" stroke-linecap="round">
              <path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path d="M4 4l16 16" stroke-width="2.4"/></svg></div>
          </div>
          <div class="hostname">${esc(d.host)}<span class="hb">&#9733;</span></div>
        </div>
        <div class="now" data-now>
          <div class="art"></div>
          <div class="meta"><b>Music playing</b>
            <span><span class="eq"><i></i><i></i><i></i><i></i></span>${esc(d.channel.name)}</span></div>
          <div class="heart">&#9825;</div>
        </div>
        <div class="row"><div class="rule"></div>
          <div class="tag">ON AIR</div>
          <div class="tag n"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg> ${num(d.listens)}</div>
          <div class="rule"></div></div>
        ${d.shop?`<div class="shop"><div class="th"></div>
          <div class="st"><b>${esc(d.shop)} <i>&#10004;</i></b><span>Merch &middot; in show</span></div>
          <div class="shopbtn">SHOP NOW</div></div>`:''}
        <div class="chatwrap"><div class="chat" data-chat></div></div>
        <div class="hearts" data-hearts></div>
        <div class="ask">
          <div class="mk"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
          <p>Ask to speak on<br><b>${esc(d.host)}</b>&rsquo;s station</p>
          <div class="go">Ask to speak</div></div>
        <div class="cmp">
          <div class="cb">&#128293;<span class="n" data-cnt>0</span></div>
          <div class="inp">Comment <span class="gif">GIF</span></div>
          <div class="cb">&#43;</div><div class="cb">&#128717;</div><div class="cb">&#128156;</div>
        </div>
      </div>
      <div class="gate" data-gate>
        <div class="nm">${esc(d.title)}</div>
        ${d.showTitle?`<div class="ttl">&ldquo;${esc(d.showTitle)}&rdquo;</div>`:''}
        ${d.context?`<div class="ctx">${esc(d.context)}</div>`:''}
        <div class="fx">
          <div><b>${num(d.listens)}</b><span>in the show</span></div>
          <div><b>${num(d.msgCount)}</b><span>messages</span></div>
          <div><b>${num(d.userCount)}</b><span>people</span></div>
          <div><b>${d.peak}/sec</b><span>peak</span></div>
        </div>
        <div class="go"><div class="pb">&#9654;</div>
          <em data-hint>${d.date} &middot; 45 seconds, at the speed it happened</em></div>
        <i class="dwell" data-dwell></i>
      </div>
    </div></div>`;

    this.fit=this.el.querySelector('.fit');
    this.box=this.el.querySelector('[data-chat]');
    this.nowEl=this.el.querySelector('[data-now]');
    this.cnt=this.el.querySelector('[data-cnt]');
    this.heartsEl=this.el.querySelector('[data-hearts]');
    this.gate=this.el.querySelector('[data-gate]');
    this.gate.addEventListener('click',()=>{App.unlock();this.begin(0);});
    this.at=d.start/1000;                 // playhead, in show seconds
    if(d.audio){
      this.audio=new Audio(d.audio);
      this.audio.preload='auto';
      this.audio.addEventListener('loadedmetadata',()=>{
        if(this.audio.currentTime<d.start/1000)this.audio.currentTime=d.start/1000;
      });
      this.audio.addEventListener('timeupdate',()=>this.tick());
      this.audio.addEventListener('ended',()=>{
        this.playing=false;
        if(App.slides[App.cur]===this) App.ended(this);
      });
    }
    this.scale();
    this.draw(0);
  }

  /* a voice note still belongs to a channel, so show it in the channel, not on a blank card */
  renderNote(t){
    const d=this.d;
    const vars=Object.entries(t).map(([k,v])=>`--${k}:${v}`).join(';');
    this.el.innerHTML=`<div class="fit"><div class="ph" style="${vars}">
      <div class="rings"></div>
      <div class="col">
        <div class="hd">
          <div class="cbtn"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="hdT"><b>${esc(d.channel.name)}</b><span>${esc(d.channel.tag)}</span></div>
          <div class="pill"># Threads</div>
          <div class="cbtn">&#128266;</div>
        </div>
        <div class="logo">${d.channel.logo
          ?`<img src="${d.channel.logo}" alt="${esc(d.channel.name)}">`
          :`<span class="wordmark">${esc(d.channel.name)}</span>`}</div>
        <div class="hostwrap">
          <div class="hostav">
            <svg class="av" viewBox="0 0 40 40" width="72" height="72">${DEFAV}</svg>
          </div>
          <div class="hostname">${esc(d.title)}<span class="hb">&#9733;</span></div>
        </div>
        <div class="now voice" data-now>
          <div class="art"></div><div class="wave" data-wv></div>
          <div class="vtime" data-vt>0:00</div>
        </div>
        <div class="row"><div class="rule"></div>
          <div class="tag">VOICE NOTE</div>
          <div class="tag n"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0z"/></svg> ${num(d.channel.members)}</div>
          <div class="rule"></div></div>
        <div class="chatwrap"><div class="chat notechat">
          <p>${esc(d.title)} recorded this straight to ${esc(d.channel.name)}.</p>
          <p>Any host on the channel can play it into a live show, to everyone listening.</p>
          <p class="q">&ldquo;${esc(d.noteTitle)}&rdquo; &middot; ${d.date}</p>
        </div></div>
        <div class="cmp">
          <div class="cb">&#128293;</div>
          <div class="inp">Comment <span class="gif">GIF</span></div>
          <div class="cb">&#43;</div><div class="cb">&#128717;</div><div class="cb">&#128156;</div>
        </div>
      </div>
      <div class="gate" data-gate>
        <div class="nm">${esc(d.title)}</div>
        <div class="ttl">sent a voice note to ${esc(d.channel.name)}</div>
        <div class="ctx">${esc(d.context)}</div>
        <div class="fx">
          <div><b>${num(d.channel.members)}</b><span>channel members</span></div>
          <div><b>${(d.dur/1000).toFixed(0)}s</b><span>note</span></div>
        </div>
        <div class="go"><div class="pb">&#9654;</div>
          <em data-hint>${d.date} &middot; straight from the artist</em></div>
        <i class="dwell" data-dwell></i>
      </div>
    </div></div>`;
    this.fit=this.el.querySelector('.fit');
    this.nowEl=this.el.querySelector('[data-now]');
    this.gate=this.el.querySelector('[data-gate]');
    this.gate.addEventListener('click',()=>{App.unlock();this.begin(0);});
    this.audio=new Audio(d.audio); this.audio.preload='auto';
    this.audio.addEventListener('timeupdate',()=>this.tickNote());
    this.audio.addEventListener('ended',()=>{
      this.playing=false;
      if(App.slides[App.cur]===this) App.ended(this);
    });
    this.at=0; this.mic=true;
    this.scale();
  }

  tickNote(){
    const d=this.d, el=this.audio.currentTime;
    if(el>d.dur/1000){ this.pause(); if(App.slides[App.cur]===this) App.ended(this); return; }
    const wv=this.nowEl.querySelector('[data-wv]'), vt=this.nowEl.querySelector('[data-vt]');
    if(wv) wv.innerHTML=this.wave(el/(d.dur/1000));
    if(vt) vt.textContent=fmt(el);
    if(App.slides[App.cur]===this) App.hud(0,el,d);
  }

  scale(){
    if(!this.fit)return;
    const k=Math.min(1,(innerHeight-40)/898,(innerWidth-32)/460);
    this.fit.style.transform=`scale(${k})`;
  }

  /* talk windows were measured off the voice track at build time, so the
     hosted build can stream audio cross-origin without WebAudio */
  talking(el){
    const w=(this.d.talk||[]);
    for(let i=0;i<w.length;i++) if(el>=w[i][0]&&el<=w[i][1]) return w[i][0];
    return -1;
  }

  wave(p){
    let h='';
    for(let i=0;i<46;i++)h+=`<i class="${i/46<p?'on':''}" style="height:${30+34*Math.abs(Math.sin(i*0.7))+18*Math.abs(Math.sin(i*2.3))}%"></i>`;
    return h;
  }
  setMic(on,el){
    if(this.mic===on)return; this.mic=on; const d=this.d;
    if(on){
      this.nowEl.className='now voice';
      this.nowEl.innerHTML=`<div class="art"></div><div class="wave" data-wv></div><div class="vtime" data-vt>0:00</div>`;
      this.micAt=el;
    }else{
      this.nowEl.className='now';
      this.nowEl.innerHTML=`<div class="art"></div><div class="meta"><b>Music playing</b>
        <span><span class="eq"><i></i><i></i><i></i><i></i></span>${esc(d.channel.name)}</span></div>
        <div class="heart">&#9825;</div>`;
    }
  }

  draw(upto){
    const d=this.d; if(d.kind==='note')return; const h=[];
    for(let i=Math.max(0,upto-9);i<upto;i++){
      const u=d.users[d.msgs[i][1]];
      const av=u[1]?`<img class="av ov" loading="lazy" src="${AVB}${u[1]}" onerror="this.style.display='none'">`:'';
      const sy=u[2]?' sy':'', badge=u[2]?'<span class="star">&#9733;</span>':'';
      h.push(`<div class="m"><div class="mav${sy}"><svg viewBox="0 0 40 40">${DEFAV}</svg>${av}${badge}</div>
        <div class="mb"><div class="mh"><b>${esc(u[0])}</b><em>just now</em></div>
        <div class="mt">${ment(d.msgs[i][2])}</div></div></div>`);
    }
    this.box.innerHTML=h.join('');
  }

  now(){ return this.audio ? this.audio.currentTime : this.at; }

  tick(){
    const d=this.d; if(d.kind==='note')return;
    const el=this.now()-d.start/1000;
    if(el<0){this.seek(d.start/1000);return;}
    if(el>d.dur/1000){
      this.pause();
      if(App.slides[App.cur]===this) App.ended(this);
      return;
    }
    const ms=el*1000; let i=0;
    while(i<d.msgs.length&&d.msgs[i][0]<=ms)i++;
    if(i!==this.shown){this.shown=i;this.draw(i);}

    let lo=ms-1000,c=0;
    for(let k=Math.max(0,i-500);k<i;k++) if(d.msgs[k][0]>lo) c++;
    this.cnt.textContent=i>999?(i/1000).toFixed(1)+'K':i;
    if(App.slides[App.cur]===this)App.hud(c,el,d);

    const at=this.talking(el);
    if(at>=0&&!this.mic)this.setMic(true,at);
    else if(at<0&&this.mic)this.setMic(false,el);
    if(this.mic){
      const wv=this.nowEl.querySelector('[data-wv]'),vt=this.nowEl.querySelector('[data-vt]');
      if(wv)wv.innerHTML=this.wave(((el-this.micAt)%30)/30);
      if(vt)vt.textContent=fmt(Math.max(0,el-this.micAt));
    }

    if(c>12&&ms-this.lastHeart>420){
      this.lastHeart=ms;
      const b=document.createElement('b'); b.textContent='\u{1F49C}';
      b.style.right=(Math.random()*40)+'px';
      b.style.animationDuration=(2.1+Math.random()*1.1)+'s';
      this.heartsEl.appendChild(b); setTimeout(()=>b.remove(),3400);
    }
  }

  seek(t){ if(this.audio)this.audio.currentTime=t; else this.at=t; }

  /* hold the intro card, then roll. ms=0 starts immediately. */
  begin(ms){
    if(!this.d||this.started)return;
    this.started=true;
    const bar=this.gate.querySelector('[data-dwell]');
    const hint=this.gate.querySelector('[data-hint]');
    if(ms>0&&bar){
      bar.style.transitionDuration=ms+'ms';
      requestAnimationFrame(()=>bar.classList.add('run'));
    }
    if(hint&&!App.unlocked) hint.textContent='Tap to start the reel';
    clearTimeout(this.dw);
    this.dw=setTimeout(()=>{
      if(App.slides[App.cur]!==this) return;      // scrolled away while the card held
      this.gate.style.display='none'; this.play();
    }, ms);
  }
  reset(){
    clearTimeout(this.dw); this.started=false;
    if(!this.gate)return;
    this.gate.style.display='';
    const bar=this.gate.querySelector('[data-dwell]');
    if(bar){bar.classList.remove('run');bar.style.transitionDuration='0ms';}
    this.pause(); this.seek(this.d.start/1000); this.shown=-1;
    if(this.d.kind!=='note') this.mic=null;
    if(this.box)this.draw(0);
  }

  play(){
    if(!this.d)return;
    if(App.slides[App.cur]!==this) return;        // never play off-screen
    App.silenceOthers(this);                      // only one clip is ever audible
    const s=this.d.start/1000;
    if(this.now()<s||this.now()>s+this.d.dur/1000)this.seek(s);
    if(this.audio){
      this.audio.play().catch(()=>{});
    }else{
      clearInterval(this.timer);
      let last=performance.now();
      this.timer=setInterval(()=>{
        const n=performance.now(); this.at+=(n-last)/1000; last=n; this.tick();
      },100);
    }
    this.playing=true;
    this.gate.style.display='none';
  }
  pause(){
    this.playing=false;
    if(this.audio)this.audio.pause(); else clearInterval(this.timer);
  }
  get paused(){ return this.audio ? this.audio.paused : !this.playing; }
}

/* ---------- app ---------- */
const App={
  slides:[],cur:0,
  async start(){
    let ids=wanted();
    if(!ids.length){
      const idx=await (await fetch('moments/index.json')).json();
      ids=idx.map(m=>m.id);                 // the whole reel, in curated order
    }
    document.getElementById('root').innerHTML=
      `<div id="feed">${ids.map(()=>'<div class="slide"></div>').join('')}</div>
       ${ids.length>1?`<div class="rail">${ids.map((_,i)=>`<i data-i="${i}"></i>`).join('')}</div>`:''}
       <div class="meter"><i id="mfill"></i></div>
       <div class="hud"><span class="t" id="hudt">&nbsp;</span>
         <span id="hudrw"><b id="hudr">0</b> msgs/sec</span><span id="hudc"></span></div>`;
    const feed=document.getElementById('feed');
    this.slides=[...feed.children].map((el,i)=>new Slide(ids[i],el));
    await this.slides[0].load();
    this.slides.slice(1).forEach(s=>s.load());

    const io=new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(e.intersectionRatio>.6){
          const i=this.slides.findIndex(s=>s.el===e.target);
          if(i>=0&&i!==this.cur){
            const prev=this.slides[this.cur];
            if(prev)prev.reset();
            this.cur=i; this.mark();
            const s=this.slides[i];
            if(s&&this.unlocked) s.begin(DWELL);   // card holds, then rolls
          }
        }
      });
    },{threshold:[.6]});
    this.slides.forEach(s=>io.observe(s.el));
    this.mark();

    document.querySelectorAll('.rail i').forEach(d=>d.addEventListener('click',()=>
      this.goTo(+d.dataset.i)));
    addEventListener('resize',()=>this.slides.forEach(s=>s.scale()));
    addEventListener('keydown',e=>{
      if(e.code==='Space'){e.preventDefault();this.toggle();}
      if(e.code==='ArrowDown')this.goTo(this.cur+1);
      if(e.code==='ArrowUp')this.goTo(this.cur-1);
    });
  },
  mark(){
    document.querySelectorAll('.rail i').forEach((d,i)=>d.classList.toggle('on',i===this.cur));
    const c=document.getElementById('hudc');
    if(c&&this.slides.length>1)c.textContent=`${this.cur+1} of ${this.slides.length}`;
  },
  unlock(){ this.unlocked=true; },
  /* scrollIntoView is unreliable inside a snap container; drive scrollTop directly */
  goTo(i){
    if(i<0||i>=this.slides.length)return;
    const feed=document.getElementById('feed');
    if(!feed)return;
    feed.scrollTo({top:i*feed.clientHeight, behavior:'smooth'});
  },
  silenceOthers(keep){
    for(const s of this.slides){
      if(s===keep||!s.audio)continue;
      s.audio.pause();
      s.playing=false;
      clearTimeout(s.dw);
      clearInterval(s.timer);
    }
  },
  toggle(){
    const s=this.slides[this.cur]; if(!s||!s.d)return;
    if(!s.started){this.unlock();s.begin(0);return;}
    if(s.paused)s.play(); else s.pause();
  },
  ended(s){
    const i=this.slides.indexOf(s);
    this.goTo(i+1<this.slides.length ? i+1 : 0);     // loop the reel
  },
  hud(rate,el,d){
    const r=document.getElementById('hudr'),t=document.getElementById('hudt'),f=document.getElementById('mfill');
    const rw=document.getElementById('hudrw');
    if(rw)rw.style.display=d.kind==='note'?'none':'';
    if(r)r.textContent=rate;
    if(t)t.textContent=d.kind==='note'?`${d.title} — voice note` : `${d.title} — ${fmt(d.start/1000+el)}`;
    if(f)f.style.width=(el/(d.dur/1000)*100)+'%';
  }
};
App.start();
</script></body></html>
